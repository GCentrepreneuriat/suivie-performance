<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance - Guillaume Gosselin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#F4F5F7;color:#222;min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none}
input,textarea{font-family:inherit}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#hdr{background:#fff;border-bottom:2px solid #EEE;padding:14px 20px;position:sticky;top:0;z-index:99}
.hi{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.hey{font-size:10px;letter-spacing:.2em;color:#B8860B;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.htl{font-size:20px;font-weight:700;margin-bottom:2px}
.hdt{font-size:11px;color:#AAA}
.scrow{display:flex;gap:16px;align-items:center}
.sdv{width:1px;height:30px;background:#EEE}
.spr{font-size:9px;color:#BBB;text-transform:uppercase;letter-spacing:.1em;text-align:center;margin-bottom:3px}
#tbar{background:#fff;border-bottom:2px solid #EEE}
.tin{max-width:900px;margin:0 auto;display:flex;padding:0 20px}
.tb{background:none;padding:11px 18px;font-size:13px;color:#AAA;border-bottom:3px solid transparent;font-weight:400}
.tb.on{color:#B8860B;border-bottom-color:#B8860B;font-weight:700}
#cont{max-width:900px;margin:0 auto;padding:20px 20px 60px}
.sr{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.sb{padding:7px 16px;font-size:12px;border-radius:20px;font-weight:600}
.sb.on{background:#222;color:#fff}
.sb:not(.on){background:#EEE;color:#888}
.card{background:#fff;border:1px solid #E8E8E8;border-radius:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.fr{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cc{border-radius:12px;overflow:hidden;border-width:2px;border-style:solid}
.ch{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.ct{font-size:15px;font-weight:700}
.cbdg{font-size:11px;background:#fff;border-radius:20px;padding:3px 10px;border-width:1px;border-style:solid}
.cb{background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:13px}
.ml{font-size:12px;color:#555;margin-bottom:4px}
.mr{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.wi{display:flex;justify-content:space-between;font-size:10px;color:#BBB;flex:1;margin-right:10px}
.ctr{display:flex;align-items:center;gap:7px}
.cv{font-size:22px;font-weight:700;min-width:28px;text-align:center}
.bm{width:30px;height:30px;border-radius:7px;border:1.5px solid #DDD;background:#FAFAFA;color:#BBB;font-size:20px;display:flex;align-items:center;justify-content:center}
.bp{width:30px;height:30px;border-radius:7px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;border-width:1.5px;border-style:solid}
.bw{height:5px;background:#EEE;border-radius:3px;overflow:hidden;margin-top:3px}
.bf{height:100%;border-radius:3px}
.slbl{font-size:10px;color:#BBB;letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}
.banner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;padding:16px 18px}
.sbox{border-radius:10px;padding:12px 14px;flex:1;min-width:90px;border-width:1px;border-style:solid}
.slb{font-size:10px;color:#888;margin-bottom:4px}
.sv{font-size:20px;font-weight:700;line-height:1}
.ss{font-size:10px;color:#BBB;margin-top:3px}
.mi{width:100%;padding:8px 12px;border:1.5px solid #DDD;border-radius:8px;font-size:14px;background:#FAFAFA;outline:none;color:#222}
.dr{background:#fff;border:1px solid #EEE;border-radius:8px;padding:10px 14px;margin-bottom:6px}
.dr.td{border-color:rgba(184,134,11,.4)}
.dt{display:flex;justify-content:space-between;align-items:center}
.dn{font-size:13px}
.dp{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:10px;border-radius:20px;padding:2px 8px;border-width:1px;border-style:solid}
.wb{background:#fff;border:1px solid #EEE;border-radius:8px;padding:12px 18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.wb.cur{border-color:rgba(184,134,11,.4);background:#FFFDF5}
.ebtn{background:#B8860B;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700}
.fc{border-radius:12px;overflow:hidden;border-width:2px;border-style:solid}
.fh{padding:11px 16px}
.fb{background:#fff;padding:13px 16px;display:flex;flex-direction:column;gap:12px}
.fl{font-size:11px;color:#888;display:block;margin-bottom:5px}
.pi{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px}
.pit{font-size:11px;color:#888}
.empty{text-align:center;color:#CCC;font-style:italic;padding:18px;background:#fff;border-radius:12px}
.totbox{background:#fff;border:1px solid #EEE;border-radius:12px;padding:14px 18px;margin-bottom:12px}
.totrow{display:flex;gap:20px;flex-wrap:wrap}
.totitem{text-align:center}
.totlbl{font-size:10px;color:#BBB;margin-bottom:3px}
.totval{font-size:26px;font-weight:700}
/* REFLEXION */
.refcard{background:#fff;border:1.5px solid #E8D5A3;border-radius:14px;padding:18px 20px;margin-bottom:14px}
.refday{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#B8860B;font-weight:700;margin-bottom:8px}
.refq{font-size:14px;color:#333;font-weight:600;margin-bottom:12px;line-height:1.5}
.reftxt{width:100%;padding:10px 13px;border:1.5px solid #DDD;border-radius:8px;font-size:13px;background:#FAFAFA;outline:none;color:#222;resize:vertical;min-height:80px;line-height:1.6}
.reftxt:focus{border-color:#B8860B}
.energy-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.energy-btn{width:38px;height:38px;border-radius:50%;font-size:14px;font-weight:700;border:2px solid #DDD;background:#FAFAFA;color:#888;transition:all .15s}
.energy-btn.on{border-color:#B8860B;background:#B8860B;color:#fff}
.saved-tag{font-size:10px;color:#1A8A3A;font-style:italic;margin-top:6px}
/* REFLEXION HISTORY */
.rh-week{background:#fff;border:1px solid #EEE;border-radius:10px;padding:14px 18px;margin-bottom:10px}
.rh-week-title{font-size:12px;color:#B8860B;font-weight:700;margin-bottom:10px}
.rh-day{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #F5F5F5}
.rh-day:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.rh-day-name{font-size:11px;color:#888;font-weight:600;margin-bottom:4px}
.rh-q{font-size:11px;color:#AAA;font-style:italic;margin-bottom:3px}
.rh-a{font-size:12px;color:#333;line-height:1.5}
.rh-energy{font-size:11px;color:#B8860B;font-weight:700;margin-top:3px}
@media(max-width:600px){.g2{grid-template-columns:1fr}.g2b{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="hdr">
  <div class="hi">
    <div>
      <div class="hey">Guillaume Gosselin - iA Groupe Financier</div>
      <div class="htl">Tableau de bord - Performance</div>
      <div class="hdt" id="hdate">Chargement...</div>
    </div>
    <div class="scrow">
      <div><div class="spr">Semaine</div><div id="sw">-</div></div>
      <div class="sdv"></div>
      <div><div class="spr">Mois</div><div id="sm">-</div></div>
    </div>
  </div>
</div>

<div id="tbar">
  <div class="tin">
    <button class="tb on" id="tb0">Aujourd'hui</button>
    <button class="tb" id="tb1">Semaine</button>
    <button class="tb" id="tb2">Mois</button>
  </div>
</div>

<div id="cont">
  <div class="sr">
    <button class="sb on" id="sb0">Activite</button>
    <button class="sb" id="sb1">Finances et ROI</button>
    <button class="sb" id="sb2">Reflexion</button>
  </div>
  <div id="app">Chargement...</div>
</div>

<script>
// CONFIG
var CATS = [
  {id:'particulier', label:'Leads Particulier', color:'#B8860B', light:'#FFF8ED', border:'#F0D080'},
  {id:'entreprise',  label:'Leads Entreprise',  color:'#2A7A6A', light:'#F0FAF7', border:'#A8DDD0'}
];

// Objectifs par semaine
var MET = [
  {id:'appels', label:'Appels composes',   wPart:60, wEnt:40},
  {id:'parles', label:'Personnes parlees', wPart:30, wEnt:10},
  {id:'rdv',    label:'RDV bookes',        wPart:8,  wEnt:3},
  {id:'ventes', label:'Ventes conclues',   wPart:1,  wEnt:0}
];
// Ventes entreprise = 1/mois
var VENTES_ENT_MONTH = 1;

// Questions de reflexion par jour (0=lundi...4=vendredi)
var REF_Q = [
  "Quelle est la meilleure action que j'ai faite aujourd'hui pour mon entreprise ?",
  "Dans mes conversations aujourd'hui, est-ce que j'ai cherche la verite ou le oui ? Donne un exemple concret.",
  "Quel prospect ou client merite une relance cette semaine que je n'ai pas encore fait ?",
  "Est-ce qu'il y a une action que j'aurais du faire et que j'ai evitee ? Si oui, pourquoi ?",
  "Si je refaisais cette semaine, qu'est-ce que je ferais differemment ?"
];
var REF_DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];

var SK = 'gg_perf_v5';
var D = {};
try { var raw = localStorage.getItem(SK); if(raw) D = JSON.parse(raw); } catch(e) { D = {}; }
var V = 'today';
var S = 'activite';

function save() { try { localStorage.setItem(SK, JSON.stringify(D)); } catch(e) {} }

function pad(n) { return n < 10 ? '0'+n : ''+n; }
function tKey() {
  var n = new Date();
  return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());
}
function wkS(ds) {
  var d = new Date(ds+'T12:00:00');
  var day = d.getDay(); if(!day) day = 7;
  d.setDate(d.getDate()-day+1);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function moS(ds) { return ds.slice(0,7); }
function getDOW(ds) {
  var d = new Date(ds+'T12:00:00');
  var day = d.getDay();
  return day === 0 ? 6 : day - 1; // 0=lundi, 4=vendredi, 5=sam, 6=dim
}
function fLong(ds) {
  try { return new Date(ds+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'long',month:'long',day:'numeric'}); }
  catch(e) { return ds; }
}
function fShort(ds) {
  try { return new Date(ds+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'short',month:'short',day:'numeric'}); }
  catch(e) { return ds; }
}
function fWR(wk) {
  try {
    var d = new Date(wk+'T12:00:00'), e = new Date(d); e.setDate(e.getDate()+4);
    return d.toLocaleDateString('fr-CA',{month:'short',day:'numeric'})+' - '+e.toLocaleDateString('fr-CA',{month:'short',day:'numeric'});
  } catch(e) { return wk; }
}
function fMo(mk) {
  try { var p = mk.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('fr-CA',{month:'long',year:'numeric'}); }
  catch(e) { return mk; }
}
function fMoney(n) {
  n = parseFloat(n) || 0;
  try { return n.toLocaleString('fr-CA',{minimumFractionDigits:0,maximumFractionDigits:0})+' $'; }
  catch(e) { return Math.round(n)+' $'; }
}

var TODAY = tKey();

function allD() { var k = Object.keys(D); k.sort(); return k; }
function wkD() { var ws = wkS(TODAY); return allD().filter(function(d){ return wkS(d)===ws; }); }
function moD() { var ms = moS(TODAY); return allD().filter(function(d){ return moS(d)===ms; }); }

function gv(cid,mid) { try { return D[TODAY][cid][mid]||0; } catch(e) { return 0; } }
function wkBC(cid,mid) {
  var wd=wkD(), s=0;
  for(var i=0;i<wd.length;i++) { try { s+=D[wd[i]][cid][mid]||0; } catch(e) {} }
  return s;
}
function finV(cid,f) { try { return D[TODAY].fin[cid][f]||0; } catch(e) { return 0; } }
function getWt(mid, cid) {
  for(var i=0;i<MET.length;i++) {
    if(MET[i].id===mid) return cid==='particulier'?MET[i].wPart:MET[i].wEnt;
  }
  return 1;
}

function sC(s) { return s>=100?'#1A8A3A':s>=70?'#B8860B':s>=50?'#C84A2A':'#AAA'; }
function sL(s) { return s>=120?'Exceptionnel!':s>=100?'Objectif depasse':s>=70?'Solide':s>=50?'A ameliorer':'Insuffisant'; }

function calcS(days) {
  if(!days||!days.length) return 0;
  var score = 0, count = 0;
  for(var i=0;i<MET.length;i++) {
    var m = MET[i];
    // Particulier
    if(m.id==='ventes') {
      // Particulier: 1/sem
      var vPart=0; for(var j=0;j<days.length;j++) { try{vPart+=D[days[j]]['particulier']['ventes']||0;}catch(e){} }
      score += vPart / m.wPart; count++;
      // Entreprise: skip weekly (monthly target)
    } else {
      var tPart=0, tEnt=0;
      for(var j=0;j<days.length;j++) {
        try{tPart+=D[days[j]]['particulier'][m.id]||0;}catch(e){}
        try{tEnt+=D[days[j]]['entreprise'][m.id]||0;}catch(e){}
      }
      score += tPart/m.wPart; count++;
      score += tEnt/m.wEnt; count++;
    }
  }
  return Math.round((score/count)*100);
}
function calcMS(md) {
  var wm={}, keys;
  for(var i=0;i<md.length;i++) { var wk=wkS(md[i]); if(!wm[wk]) wm[wk]=[]; wm[wk].push(md[i]); }
  keys = Object.keys(wm); if(!keys.length) return 0;
  var sum=0; for(var j=0;j<keys.length;j++) sum+=calcS(wm[keys[j]]);
  return Math.round(sum/keys.length);
}

function upM(cid,mid,delta) {
  if(!D[TODAY]) D[TODAY]={};
  if(!D[TODAY][cid]) D[TODAY][cid]={};
  D[TODAY][cid][mid]=Math.max(0,(D[TODAY][cid][mid]||0)+delta);
  save(); render();
}
function upF(cid,field,val) {
  if(!D[TODAY]) D[TODAY]={};
  if(!D[TODAY].fin) D[TODAY].fin={};
  if(!D[TODAY].fin[cid]) D[TODAY].fin[cid]={};
  D[TODAY].fin[cid][field]=parseFloat(val)||0;
  save();
}
function upFL(cid,delta) {
  if(!D[TODAY]) D[TODAY]={};
  if(!D[TODAY].fin) D[TODAY].fin={};
  if(!D[TODAY].fin[cid]) D[TODAY].fin[cid]={};
  D[TODAY].fin[cid].leads=Math.max(0,(D[TODAY].fin[cid].leads||0)+delta);
  save();
  var el=document.getElementById('fl-'+cid);
  if(el) el.textContent=D[TODAY].fin[cid].leads;
}
function saveRef(field, val) {
  if(!D[TODAY]) D[TODAY]={};
  if(!D[TODAY].ref) D[TODAY].ref={};
  D[TODAY].ref[field]=val;
  save();
}
function saveEnergy(val) {
  if(!D[TODAY]) D[TODAY]={};
  if(!D[TODAY].ref) D[TODAY].ref={};
  D[TODAY].ref.energy=val;
  save();
  render();
}

function sbadge(score,lg) {
  var c=sC(score), fs=lg?'36px':'20px', lfs=lg?'11px':'9px', bw=lg?'80px':'50px';
  return '<div style="display:flex;align-items:center;gap:'+(lg?11:6)+'px">'
    +'<div style="font-size:'+fs+';color:'+c+';font-weight:700;line-height:1">'+score+'%</div>'
    +'<div><div style="font-size:'+lfs+';color:'+c+';font-style:italic">'+sL(score)+'</div>'
    +'<div style="height:4px;width:'+bw+';background:#EEE;border-radius:2px;margin-top:3px;overflow:hidden">'
    +'<div style="height:100%;width:'+Math.min(score,100)+'%;background:'+c+';border-radius:2px"></div>'
    +'</div></div></div>';
}
function bar(pct,color) {
  var p=Math.min(pct,100), bg=p>=100?'#1A8A3A':color;
  return '<div class="bw"><div class="bf" style="width:'+p+'%;background:'+bg+'"></div></div>';
}
function sbox(lbl,val,sub,color,bg,brd) {
  color=color||'#222'; bg=bg||'#F8F8F8'; brd=brd||'#EEE';
  return '<div class="sbox" style="background:'+bg+';border-color:'+brd+'">'
    +'<div class="slb">'+lbl+'</div>'
    +'<div class="sv" style="color:'+color+'">'+val+'</div>'
    +(sub?'<div class="ss">'+sub+'</div>':'')+'</div>';
}

// TODAY ACTIVITE
function rTA() {
  var html = '<div class="g2">';
  for(var ci=0;ci<CATS.length;ci++) {
    var cat=CATS[ci], dt=0;
    for(var mi=0;mi<MET.length;mi++) dt+=gv(cat.id,MET[mi].id);
    // Daily targets
    var dailyTargets = {
      particulier: {appels:12, parles:6, rdv:2, ventes:1},
      entreprise:  {appels:8,  parles:2, rdv:1, ventes:0}
    };
    html+='<div class="cc" style="border-color:'+cat.border+'">';
    html+='<div class="ch" style="background:'+cat.light+'">';
    html+='<div class="ct" style="color:'+cat.color+'">'+cat.label+'</div>';
    html+='<div class="cbdg" style="color:'+cat.color+';border-color:'+cat.border+'">'+dt+" auj.</div></div>";
    html+='<div class="cb">';
    for(var mi2=0;mi2<MET.length;mi2++) {
      var m=MET[mi2];
      var dv=gv(cat.id,m.id);
      var wt = cat.id==='particulier'?m.wPart:m.wEnt;
      var wv=wkBC(cat.id,m.id);
      var dt2 = dailyTargets[cat.id][m.id];
      // For entreprise ventes, show monthly
      var isMonthlyVente = (cat.id==='entreprise' && m.id==='ventes');
      var pct = isMonthlyVente ? 0 : Math.round((wv/wt)*100);
      var wc2=wv>=(isMonthlyVente?0:wt)?'#1A8A3A':cat.color;
      html+='<div><div class="ml">'+m.label+'</div>';
      html+='<div class="mr">';
      if(isMonthlyVente) {
        html+='<div class="wi"><span style="color:#BBB">Obj: <strong style="color:'+cat.color+'">1/mois</strong></span></div>';
      } else {
        html+='<div class="wi"><span style="color:#BBB">Sem: <strong style="color:'+wc2+'">'+wv+'</strong>/'+wt+'</span>';
        html+='<span style="color:'+(pct>=100?'#1A8A3A':'#CCC')+'">'+(pct>=100?'OK ':'')+pct+'%</span></div>';
      }
      html+='<div class="ctr">';
      html+='<button class="bm btn-m" data-cid="'+cat.id+'" data-mid="'+m.id+'">-</button>';
      html+='<span class="cv">'+dv+'</span>';
      html+='<button class="bp btn-p" style="border-color:'+cat.border+';background:'+cat.light+';color:'+cat.color+'" data-cid="'+cat.id+'" data-mid="'+m.id+'">+</button>';
      html+='</div></div>';
      if(!isMonthlyVente) html+=bar(pct,cat.color);
      html+='</div>';
    }
    html+='</div></div>';
  }
  html+='</div>';
  // Total combine
  html+='<div class="totbox"><div class="slbl">Total combine aujourd\'hui</div><div class="totrow">';
  for(var mi3=0;mi3<MET.length;mi3++) {
    var m2=MET[mi3], tot=0;
    for(var ci2=0;ci2<CATS.length;ci2++) tot+=gv(CATS[ci2].id,m2.id);
    html+='<div class="totitem"><div class="totlbl">'+m2.label+'</div><div class="totval">'+tot+'</div></div>';
  }
  html+='</div></div>';
  var ws=calcS(wkD());
  html+='<div class="card" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">';
  html+='<span style="font-size:12px;color:#BBB;font-style:italic">Objectifs hebdomadaires - repartis librement.</span>';
  html+=sbadge(ws,false)+'</div>';
  return html;
}

// TODAY REFLEXION
function rTR() {
  var dow = getDOW(TODAY);
  var ref = {}; try { ref = D[TODAY].ref || {}; } catch(e) {}
  var energy = ref.energy || 0;
  var isWeekday = dow >= 0 && dow <= 4;
  var html = '';

  // Energy score
  html += '<div class="refcard">';
  html += '<div class="refday">Energie de la journee</div>';
  html += '<div class="refq">Sur une echelle de 1 a 10, quel etait ton niveau d\'energie aujourd\'hui ?</div>';
  html += '<div class="energy-row">';
  for(var i=1;i<=10;i++) {
    html += '<button class="energy-btn'+(energy===i?' on':'')+'" data-val="'+i+'">'+i+'</button>';
  }
  html += '</div>';
  if(energy>0) html += '<div class="saved-tag">Energie enregistree : '+energy+'/10</div>';
  html += '</div>';

  // Question du jour
  if(isWeekday) {
    var q = REF_Q[dow];
    var dayName = REF_DAYS[dow];
    var answer = ref.answer || '';
    html += '<div class="refcard">';
    html += '<div class="refday">Question du '+dayName+'</div>';

      var m2=MET[mi2];
      weekSections+='<tr><td style="padding:4px 8px;border-bottom:1px solid #EEE">'+m2.label+'</td>';
      weekSections+='<td style="padding:4px 8px;border-bottom:1px solid #EEE;text-align:center;font-weight:700">'+wt2[m2.id]['particulier']+'</td>';
      weekSections+='<td style="padding:4px 8px;border-bottom:1px solid #EEE;text-align:center;font-weight:700">'+wt2[m2.id]['entreprise']+'</td></tr>';
    }
    weekSections+='</table>';
    if(wb||wr) weekSections+='<div style="font-size:11px;color:#888;margin-bottom:8px">Budget pub: '+fMoney(wb)+' | Revenus: '+fMoney(wr)+' | Profit: '+(wr-wb>=0?'+':'')+fMoney(wr-wb)+'</div>';
    // Reflexions
    var hasRef=false;
    for(var di4=0;di4<days.length;di4++){
      var d2=days[di4], dow=getDOW(d2), ref={};
      try{ref=D[d2].ref||{};}catch(e){}
      if(dow<0||dow>4) continue;
      if(!hasRef){weekSections+='<div style="font-size:11px;font-weight:700;color:#B8860B;margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em">Reflexions</div>';hasRef=true;}
      var energy=ref.energy||0, answer=ref.answer||'';
      weekSections+='<div style="margin-bottom:6px;padding:8px 10px;background:#fff;border-radius:6px;border-left:3px solid #B8860B">';
      weekSections+='<div style="font-size:11px;font-weight:700;color:#555;margin-bottom:2px">'+REF_DAYS[dow]+(energy>0?' - Energie: '+energy+'/10':'')+'</div>';
      weekSections+='<div style="font-size:10px;color:#AAA;font-style:italic;margin-bottom:3px">'+REF_Q[dow]+'</div>';
      weekSections+='<div style="font-size:12px;color:#333;line-height:1.5">'+(answer?answer:'<em style="color:#CCC">Pas de reponse</em>')+'</div>';
      weekSections+='</div>';
    }
    weekSections+='</div>';
  }

  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Performance '+ml+'</title>'
    +'<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;color:#222;padding:30px;font-size:13px}'
    +'h2{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#999;margin:18px 0 8px;font-weight:400}'
    +'.footer{margin-top:28px;padding-top:10px;border-top:1px solid #EEE;font-size:10px;color:#CCC}'
    +'@media print{.page-break{page-break-before:always}}</style></head><body>';
  html+='<div style="display:flex;justify-content:space-between;margin-bottom:6px"><div>'
    +'<div style="font-size:10px;letter-spacing:.2em;color:#B8860B;text-transform:uppercase;font-weight:700;margin-bottom:4px">Guillaume Gosselin - iA Groupe Financier</div>'
    +'<div style="font-size:20px;font-weight:700;margin-bottom:2px">Rapport de performance</div>'
    +'<div style="color:#999;font-size:12px">'+ml+' - '+wc+' semaine'+(wc>1?'s':'')+'</div></div>'
    +'<div style="font-size:11px;color:#CCC">Exporte le '+new Date().toLocaleDateString('fr-CA')+'</div></div>';
  html+='<div style="background:#F8F8F8;border:1px solid #DDD;border-radius:9px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:16px 0">'
    +'<div style="font-size:12px;color:#999">Score global - moyenne des semaines</div>'
    +'<div style="text-align:right"><div style="font-size:36px;font-weight:700;color:'+sc+'">'+ms+'%</div>'
    +'<div style="font-size:11px;color:'+sc+';font-style:italic;margin-top:2px">'+sL(ms)+'</div></div></div>';
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">';
  html+='<div style="background:#F8F8F8;border:1px solid #EEE;border-radius:8px;padding:10px 14px;flex:1;min-width:90px"><div style="font-size:10px;color:#999;margin-bottom:3px">Budget pub</div><div style="font-size:18px;font-weight:700">'+fMoney(fin.budget)+'</div></div>';
  html+='<div style="background:#F8F8F8;border:1px solid #EEE;border-radius:8px;padding:10px 14px;flex:1;min-width:90px"><div style="font-size:10px;color:#999;margin-bottom:3px">Revenus</div><div style="font-size:18px;font-weight:700;color:#1A8A3A">'+fMoney(fin.commissions)+'</div></div>';
  html+='<div style="background:'+(prof>=0?'#F0FAF5':'#FFF5F5')+';border:1px solid '+(prof>=0?'#A8DDD0':'#F0C0C0')+';border-radius:8px;padding:10px 14px;flex:1;min-width:90px"><div style="font-size:10px;color:#999;margin-bottom:3px">Profit net</div><div style="font-size:18px;font-weight:700;color:'+(prof>=0?'#1A8A3A':'#C84A2A')+'">'+(prof>=0?'+':'')+fMoney(prof)+'</div></div>';
  if(roi!==null) html+='<div style="background:#F8F8F8;border:1px solid #EEE;border-radius:8px;padding:10px 14px;flex:1;min-width:90px"><div style="font-size:10px;color:#999;margin-bottom:3px">ROI pub</div><div style="font-size:18px;font-weight:700;color:'+(roi>=0?'#1A8A3A':'#C84A2A')+'">'+roi+'%</div></div>';
  html+='</div>';
  html+='<h2>Detail par semaine - Activite, Finances et Reflexions</h2>';
  html+=weekSections;
  html+='<div class="footer">Tableau de bord Guillaume Gosselin - iA Groupe Financier - '+ml+'</div></body></html>';

  var blob=new Blob([html],{type:'text/html'}); var url=URL.createObjectURL(blob); var win=window.open(url,'_blank'); if(win) win.onload=function(){win.print();};
}

// RENDER
function render() {
  try {
    var wd=wkD(), md=moD(), ws=calcS(wd), ms2=calcMS(md);
    var el;
    el=document.getElementById('hdate'); if(el) el.textContent=fLong(TODAY);
    el=document.getElementById('sw'); if(el) el.innerHTML=sbadge(ws,false);
    el=document.getElementById('sm'); if(el) el.innerHTML=sbadge(ms2,false);
    el=document.getElementById('tb0'); if(el) el.className='tb'+(V==='today'?' on':'');
    el=document.getElementById('tb1'); if(el) el.className='tb'+(V==='week'?' on':'');
    el=document.getElementById('tb2'); if(el) el.className='tb'+(V==='month'?' on':'');
    el=document.getElementById('sb0'); if(el) el.className='sb'+(S==='activite'?' on':'');
    el=document.getElementById('sb1'); if(el) el.className='sb'+(S==='finances'?' on':'');
    el=document.getElementById('sb2'); if(el) el.className='sb'+(S==='reflexion'?' on':'');
    var html='';
    if(V==='today'&&S==='activite') html=rTA();
    else if(V==='today'&&S==='finances') html=rTF();
    else if(V==='today'&&S==='reflexion') html=rTR();
    else if(V==='week'&&S==='activite') html=rWA();
    else if(V==='week'&&S==='finances') html=rWF();
    else if(V==='week'&&S==='reflexion') html=rWR();
    else if(V==='month'&&S==='activite') html=rMA();
    else if(V==='month'&&S==='finances') html=rMF();
    else if(V==='month'&&S==='reflexion') html=rMR();
    el=document.getElementById('app'); if(el) el.innerHTML=html;
    bindEvents();
  } catch(e) {
    var app=document.getElementById('app');
    if(app) app.innerHTML='<div style="padding:20px;background:#fff;border-radius:12px;border:1px solid #F0C0C0;color:#C84A2A;font-weight:700">Erreur: '+e.message+'</div>';
  }
}

function bindEvents() {
  var i, el, els;
  el=document.getElementById('tb0'); if(el) el.addEventListener('click',function(){V='today';render();});
  el=document.getElementById('tb1'); if(el) el.addEventListener('click',function(){V='week';render();});
  el=document.getElementById('tb2'); if(el) el.addEventListener('click',function(){V='month';render();});
  el=document.getElementById('sb0'); if(el) el.addEventListener('click',function(){S='activite';render();});
  el=document.getElementById('sb1'); if(el) el.addEventListener('click',function(){S='finances';render();});
  el=document.getElementById('sb2'); if(el) el.addEventListener('click',function(){S='reflexion';render();});
  el=document.getElementById('expbtn'); if(el) el.addEventListener('click',exportPDF);
  el=document.getElementById('expbtn2'); if(el) el.addEventListener('click',exportPDF);

  // Metric buttons
  els=document.querySelectorAll('.btn-m');
  for(i=0;i<els.length;i++){(function(b){b.addEventListener('click',function(){upM(b.getAttribute('data-cid'),b.getAttribute('data-mid'),-1);});})(els[i]);}
  els=document.querySelectorAll('.btn-p');
  for(i=0;i<els.length;i++){(function(b){b.addEventListener('click',function(){upM(b.getAttribute('data-cid'),b.getAttribute('data-mid'),1);});})(els[i]);}

  // Finance buttons
  els=document.querySelectorAll('.btn-fl');
  for(i=0;i<els.length;i++){(function(b){b.addEventListener('click',function(){upFL(b.getAttribute('data-cid'),-1);});})(els[i]);}
  els=document.querySelectorAll('.btn-fp');
  for(i=0;i<els.length;i++){(function(b){b.addEventListener('click',function(){upFL(b.getAttribute('data-cid'),1);});})(els[i]);}
  els=document.querySelectorAll('.fin-budget');
  for(i=0;i<els.length;i++){(function(inp){inp.addEventListener('change',function(){upF(inp.getAttribute('data-cid'),'budget',inp.value);});})(els[i]);}
  els=document.querySelectorAll('.fin-comm');
  for(i=0;i<els.length;i++){(function(inp){inp.addEventListener('change',function(){upF(inp.getAttribute('data-cid'),'commissions',inp.value);});})(els[i]);}

  // Energy buttons
  els=document.querySelectorAll('.energy-btn');
  for(i=0;i<els.length;i++){(function(b){b.addEventListener('click',function(){saveEnergy(parseInt(b.getAttribute('data-val')));});})(els[i]);}

  // Reflexion save
  el=document.getElementById('ref-save-btn');
  if(el) {
    el.addEventListener('click',function(){
      var ta=document.getElementById('ref-answer');
      if(ta) {
        saveRef('answer',ta.value);
        var saved=document.getElementById('ref-saved');
        if(saved) saved.textContent='Reponse enregistree';
      }
    });
  }
}

window.addEventListener('load',function(){render();});
</script>
